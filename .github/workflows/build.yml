name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test setup and rollback
        run: python -m unittest discover -s tests -v
      - name: Install pinned Android SDK components
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager'
          if ($IsWindows) { $manager += '.bat' }
          & $manager 'platforms;android-34' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
      - name: Build on Linux
        if: runner.os != 'Windows'
        run: bash build.sh
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./build.ps1
      - name: Upload development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xmb-home-development-${{ runner.os }}
          path: xmb-home.apk
          if-no-files-found: error
          retention-days: 14
